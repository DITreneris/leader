name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm test

      - name: Dependency audit (high or critical only)
        run: npm audit --audit-level=high

  verify-deploy:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - BASE_PATH: /leader
            SITE_URL: https://${{ github.repository_owner }}.github.io
          - BASE_PATH: /
            SITE_URL: https://promptanatomy.pro
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ matrix.BASE_PATH }}
          SITE_URL: ${{ matrix.SITE_URL }}

      - name: Verify build artifacts
        run: npm run verify:build
        env:
          BASE_PATH: ${{ matrix.BASE_PATH }}
          SITE_URL: ${{ matrix.SITE_URL }}

  e2e:
    runs-on: ubuntu-latest
    needs: verify-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (GitHub Pages env for Playwright)
        run: npm run build
        env:
          BASE_PATH: /leader
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - name: Install Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Lighthouse CI
        run: npx lhci autorun
        env:
          BASE_PATH: /leader
